name: Deploy Pages (main root + preview-ux-v2)

on:
  push:
    branches: [main, ux-reset-v2]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main (root webu)
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-src
          fetch-depth: 1

      - name: Checkout ux-reset-v2 (preview)
        uses: actions/checkout@v4
        with:
          ref: ux-reset-v2
          path: preview-src
          sparse-checkout: |
            preview-ux-v2/
          fetch-depth: 1

      - name: Sestavit artifact (root = main, preview = ux-reset-v2)
        run: |
          set -euo pipefail
          mkdir -p site
          # root: přesná kopie main (produkce)
          cp -r main-src/. site/
          rm -rf site/.git
          # preview podsložka: jen preview-ux-v2 obsah z pracovní větve
          mkdir -p site/preview-ux-v2
          cp -r preview-src/preview-ux-v2/. site/preview-ux-v2/

      - name: Kontrola 1 — root odpovídá main (byte-shodný index)
        run: |
          set -euo pipefail
          if ! cmp -s site/index.html main-src/index.html; then
            echo "::error::root index.html neodpovídá main — produkce byla nahrazena!"
            exit 1
          fi
          if ! cmp -s site/sw.js main-src/sw.js; then
            echo "::error::root sw.js neodpovídá main!"
            exit 1
          fi
          echo "OK: root index/sw.js byte-shodný s main"

      - name: Kontrola 2 — preview obsah odpovídá ux-reset-v2
        run: |
          set -euo pipefail
          if ! cmp -s site/preview-ux-v2/index.html preview-src/preview-ux-v2/index.html; then
            echo "::error::preview index neodpovídá ux-reset-v2!"
            exit 1
          fi
          echo "OK: preview index odpovídá ux-reset-v2"

      - name: Kontrola 3 — preview používá izolovaný save klíč
        run: |
          set -euo pipefail
          grep -q 'perla_promeny_preview_v5' site/preview-ux-v2/index.html \
            || { echo "::error::preview neobsahuje preview klíč!"; exit 1; }
          echo "OK: preview klíč přítomen"

      - name: Kontrola 4 — preview neobsahuje SW registraci ani manifest
        run: |
          set -euo pipefail
          if grep -q 'serviceWorker\.register' site/preview-ux-v2/index.html; then
            echo "::error::preview obsahuje serviceWorker.register!"
            exit 1
          fi
          if grep -q 'rel="manifest"' site/preview-ux-v2/index.html; then
            echo "::error::preview obsahuje manifest link!"
            exit 1
          fi
          echo "OK: preview bez SW registrace a manifestu"

      - name: Kontrola 5 — preview nezapisuje do produkčního klíče
        run: |
          set -euo pipefail
          # jediná povolená reference na produkční klíč = read v importní funkci (getItem)
          BAD=$(grep -c 'localStorage\.setItem("perla-promeny-v4' site/preview-ux-v2/index.html || true)
          if [ "$BAD" != "0" ]; then
            echo "::error::preview zapisuje do produkčního klíče!"
            exit 1
          fi
          if grep -q 'localStorage\.removeItem("perla-promeny-v4' site/preview-ux-v2/index.html; then
            echo "::error::preview maže produkční klíč!"
            exit 1
          fi
          echo "OK: preview nemá zápis/smazání produkčního klíče"

      - name: Kontrola 6 — produkční soubory nepřepsány pracovní verzí
        run: |
          set -euo pipefail
          # klíčový marker: produkční index nesmí obsahovat preview klíč ani PREVIEW_MODE
          if grep -q 'perla_promeny_preview_v5' site/index.html; then
            echo "::error::root index obsahuje preview klíč — došlo k prolnutí verzí!"
            exit 1
          fi
          if grep -q 'PREVIEW_MODE = true' site/index.html; then
            echo "::error::root index obsahuje PREVIEW_MODE — došlo k prolnutí verzí!"
            exit 1
          fi
          echo "OK: root bez preview markerů"

      - name: Nahrát Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
